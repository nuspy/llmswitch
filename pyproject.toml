[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmswitch"
version = "0.1.0"
description = "Provider LLM locali e remoti con gestione seria della VRAM: un modello gia' in memoria si usa e basta."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nuspy" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# Blueprint Flask pronto all'uso: si installa solo se serve.
flask = ["flask>=3.0"]

[tool.setuptools.packages.find]
include = ["llmswitch*"]
